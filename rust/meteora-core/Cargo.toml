[package]
name = "meteora-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "GPL-3.0-only"

[lib]
name = "meteora_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22.4"
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "allocator"] }
serde = { version = "1", features = ["derive"] }
# Keeps object keys in document order, as kotlinx.serialization did.
serde_json = { version = "1", features = ["preserve_order"] }

# rquickjs ships no prebuilt bindings for Android: generate them there.
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "allocator", "bindgen"] }

# QuickJS at -O0 cannot preprocess a real player within the 15 s limit, so `cargo test` would fail.
[profile.dev.package.rquickjs-sys]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
